<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Permainan Booth · HSAH World Stroke &amp; Diabetic Day 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#061430;--navy2:#0b2a5c;--blue:#1d5bff;--cyan:#27c4ff;--red:#ff3b3b;--gold:#ffc53d;--green:#2ecc71;--white:#fff;--muted:#9db0d1;--line:rgba(255,255,255,.14);--glass:rgba(255,255,255,.07);
--display:"Poppins",system-ui,sans-serif;--body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% -10%,rgba(29,91,255,.35),transparent 50%),radial-gradient(circle at 100% 0%,rgba(255,59,59,.25),transparent 45%),var(--navy);color:var(--white);font-family:var(--body);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15}
button,input{font-family:var(--body)}
input{-webkit-user-select:text;user-select:text}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
[hidden]{display:none!important}
.wrap{max-width:860px;margin:auto;padding:18px 16px 40px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--cyan)}
.sub{color:#c8d7f2;margin:6px 0 20px}
.note{font-size:13px;color:var(--muted);margin-top:18px;line-height:1.5}

/* ---------- Lobi ---------- */
.lobbyhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.lobbyhead h1{font-size:clamp(1.8rem,5vw,2.5rem);font-weight:900;margin-top:6px}
.progress{margin-top:10px;font-size:14px;color:#dbe6ff;background:var(--glass);border:1px solid var(--line);display:inline-block;padding:8px 14px;border-radius:12px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.gc{position:relative;overflow:hidden;background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:18px;text-align:left;color:var(--white);cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s;display:flex;flex-direction:column;gap:6px;min-height:186px}
.gc::after{content:"";position:absolute;width:140px;height:140px;border-radius:50%;right:-50px;top:-50px;background:var(--c,var(--blue));opacity:.28;filter:blur(18px)}
.gc:hover{transform:translateY(-4px);border-color:var(--c,var(--cyan));box-shadow:0 14px 30px rgba(0,0,0,.3)}
.gc.blue{--c:var(--blue)} .gc.red{--c:var(--red)} .gc.cyan{--c:var(--cyan)} .gc.gold{--c:var(--gold)}
.gc .no{font-size:11px;font-weight:700;letter-spacing:1.2px;color:var(--muted);position:relative;z-index:1}
.gc .gi{font-size:34px;position:relative;z-index:1}
.gc h3{font-size:18px;position:relative;z-index:1}
.gc p{margin:0;color:#c8d7f2;font-size:13px;position:relative;z-index:1}
.gc .go{margin-top:auto;font-size:13px;font-weight:700;color:var(--cyan);position:relative;z-index:1}

/* ---------- Butang ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:14px;border:none;font-weight:700;font-size:15px;cursor:pointer;min-height:48px;color:#fff;background:linear-gradient(135deg,var(--blue),var(--cyan));text-decoration:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-g{background:var(--glass);border:1px solid var(--line)}
.btn-gold{background:linear-gradient(135deg,#ffd76a,var(--gold));color:var(--navy)}
.big-btn{display:block;width:100%;max-width:360px;margin:16px auto 0;padding:18px;border-radius:18px;border:none;font-family:var(--display);font-weight:900;font-size:19px;color:#fff;background:linear-gradient(135deg,var(--blue),var(--cyan));box-shadow:0 14px 30px rgba(29,91,255,.45);cursor:pointer;touch-action:manipulation;min-height:60px}
.big-btn:disabled{opacity:.4;box-shadow:none;cursor:not-allowed}
.big-btn:active:not(:disabled){transform:scale(.98)}

/* ---------- Skrin permainan ---------- */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.back{background:var(--glass);border:1px solid var(--line);color:var(--white);padding:9px 14px;border-radius:12px;cursor:pointer;font-weight:600;font-size:14px}
.kick{font-size:12px;letter-spacing:1.5px;font-weight:700;color:var(--cyan);text-transform:uppercase}
.ptitle{font-size:clamp(1.5rem,4.5vw,2.1rem);font-weight:900;margin:10px 0 14px}
.hudrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pill{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:7px 12px;font-size:12px;font-weight:700;min-width:70px;text-align:center}
.pill b{font-family:var(--display);font-size:17px;display:block;line-height:1.1}
.arena{position:relative;background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:24px;padding:20px 16px;min-height:300px;overflow:hidden}
.prompt{font-family:var(--display);font-weight:800;font-size:clamp(1.05rem,3.4vw,1.4rem);text-align:center;margin:2px 0 14px}
.feedback{min-height:24px;text-align:center;font-weight:700;font-size:15px;margin-top:12px;line-height:1.45}
.feedback.ok{color:#8ef0b0}.feedback.no{color:#ff9d9d}
.timebar{height:8px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;margin-bottom:14px}
.timebar div{height:100%;width:100%;background:linear-gradient(90deg,var(--red),var(--gold),var(--green));transition:width .3s linear}
.lbl{font-family:var(--display);font-weight:800;font-size:18px;color:var(--gold)}
.lbl2{font-size:13px;color:var(--muted);margin-top:16px;font-weight:600}
.list{display:grid;gap:6px;margin:12px 0}
.row{display:flex;justify-content:space-between;gap:10px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:14px;color:var(--muted)}
.row.got{color:var(--white);border-color:rgba(46,204,113,.5)}
.row b{font-family:var(--display);color:var(--gold)}
.row.got b{color:var(--green)}
.tip{text-align:center;color:var(--muted);font-size:14px;margin:0 0 6px}
.stageline{text-align:center;font-size:13px;color:var(--cyan);font-weight:700;letter-spacing:.5px;margin-bottom:8px}

/* Jalan Seimbang */
.track{position:relative;height:74px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);margin:22px 0 8px;overflow:hidden}
.zone{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,rgba(46,204,113,.15),rgba(46,204,113,.55),rgba(46,204,113,.15));border-left:2px solid var(--green);border-right:2px solid var(--green)}
.runner{position:absolute;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,var(--cyan) 40%,var(--blue));box-shadow:0 0 22px rgba(39,196,255,.8)}
.runner.hit{box-shadow:0 0 34px var(--green)}
.runner.miss{box-shadow:0 0 34px var(--red)}

/* Ingat Rutin */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:rgba(255,255,255,.07);border:1.5px solid var(--line);border-radius:18px;padding:16px 10px;color:var(--white);cursor:pointer;min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:transform .15s,background .2s,border-color .2s}
.tile span{font-size:38px;line-height:1}
.tile small{font-size:13px;color:#dbe6ff;text-align:center;line-height:1.3}
.tile.lit{background:linear-gradient(160deg,var(--cyan),var(--blue));border-color:var(--cyan);box-shadow:0 0 24px rgba(39,196,255,.7);transform:scale(1.03)}

/* Padan Ubat */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:560px){.mem{grid-template-columns:repeat(3,1fr)}}
.mc{perspective:800px;min-height:96px;border:none;background:none;padding:0;cursor:pointer}
.mc .in{position:relative;width:100%;height:96px;transition:transform .5s;transform-style:preserve-3d}
.mc.flip .in{transform:rotateY(180deg)}
.mc .f,.mc .b{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;padding:6px;text-align:center;font-size:12px;font-weight:700;color:var(--white);line-height:1.25}
.mc .f{background:linear-gradient(160deg,var(--navy2),var(--blue));border:1.5px solid var(--line);font-family:var(--display);font-size:22px}
.mc .b{background:linear-gradient(160deg,#fff,#dbe9ff);color:var(--navy);transform:rotateY(180deg);border:1.5px solid var(--cyan)}
.mc .b.ic{font-size:32px}
.mc.done .b{background:linear-gradient(160deg,#c9f7da,#8ef0b0)}

/* Kenali Gula */
.item{text-align:center;padding:6px 0}
.item .ic{font-size:66px;line-height:1;animation:pop .35s ease}
.item .tt{font-family:var(--display);font-weight:800;font-size:19px;margin-top:6px}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.choice button{border:none;border-radius:16px;padding:18px 10px;font-family:var(--display);font-weight:800;font-size:16px;color:#fff;cursor:pointer;min-height:76px;line-height:1.3}
.choice .lo{background:linear-gradient(135deg,#1fb68a,#1e8f6a)}
.choice .hi{background:linear-gradient(135deg,#ff7a2e,var(--red))}
.choice button:disabled{opacity:.5;cursor:default}

/* Tarik Nafas */
.breath{display:flex;flex-direction:column;align-items:center;gap:12px}
.bcircle{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#bfeaff,var(--cyan) 35%,var(--blue) 80%);box-shadow:0 0 50px rgba(39,196,255,.55);transform:scale(.8);transition:transform 1s ease-in-out;touch-action:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;color:var(--navy);font-size:15px;text-align:center;padding:12px}
.bcircle.on{transform:scale(1.25)}
.phase{font-family:var(--display);font-weight:800;font-size:18px;min-height:28px;text-align:center}
.meter{width:100%;max-width:360px;height:10px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.meter div{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--green));transition:width .3s}

/* Pinggan Sihat */
.guide{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:12px;color:var(--muted);text-align:center;margin-bottom:10px}
.guide b{display:block;color:var(--gold);font-family:var(--display);font-size:13px}
.plate{width:min(260px,70vw);aspect-ratio:1;border-radius:50%;margin:6px auto 12px;background:radial-gradient(circle,#fff 0 56%,#dbe9ff 57% 100%);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:6px;padding:14px}
.plate .slot{border-radius:14px;background:rgba(6,20,48,.08);border:2px dashed #9db0d1;display:flex;align-items:center;justify-content:center;font-size:30px;cursor:pointer;color:var(--navy);flex-wrap:wrap}
.plate .slot.full{border-style:solid;border-color:transparent;background:rgba(6,20,48,.04)}
.pool{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media(max-width:560px){.pool{grid-template-columns:repeat(4,1fr)}}
.pool button{background:rgba(255,255,255,.07);border:1.5px solid var(--line);border-radius:14px;padding:10px 4px;color:var(--white);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:72px}
.pool button span{font-size:26px;line-height:1}
.pool button small{font-size:10px;line-height:1.2;color:#dbe6ff}
.pool button.used{opacity:.3;cursor:default}

/* Sebut Pantas */
.heard{text-align:center;font-size:14px;color:#dbe6ff;min-height:20px;margin-top:8px}
.status{text-align:center;font-size:14px;color:var(--cyan);min-height:20px;margin-top:6px;font-weight:600}
.mic-on{animation:glow 1.1s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 14px 30px rgba(255,59,59,.35)}50%{box-shadow:0 0 40px rgba(255,59,59,.85)}}
.ghost{background:var(--glass);border:1px solid var(--line);margin:14px auto 0;display:flex}
.mic-note{font-size:12px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.5}

/* Misi Penyelamat */
.spot{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:560px){.spot{grid-template-columns:repeat(3,1fr)}}
.sp{background:rgba(255,255,255,.06);border:1.5px solid var(--line);border-radius:16px;padding:10px 6px;color:var(--white);cursor:pointer;min-height:98px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;line-height:1.25;text-align:center}
.sp span{font-size:28px;line-height:1}
.sp.risk{border-color:var(--gold);background:rgba(255,197,61,.18)}
.sp.wrong{border-color:var(--red);background:rgba(255,59,59,.2)}
.sp:disabled{cursor:default}

/* Waktu Emas */
.stage-dots{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.stage-dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.18);border:1px solid var(--line)}
.stage-dots i.on{background:var(--gold);border-color:var(--gold)}
.stage-dots i.ok{background:var(--green);border-color:var(--green)}
.scene{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,rgba(11,42,92,.85),rgba(29,91,255,.25));border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:14px}
.scene.urgent{background:linear-gradient(135deg,rgba(90,10,20,.85),rgba(255,59,59,.25))}
.scene .pic{flex:0 0 80px;height:80px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:42px}
.scene .label{font-size:11px;letter-spacing:1.5px;font-weight:700;color:var(--cyan);text-transform:uppercase;margin-bottom:4px}
.scene .story{font-size:14px;line-height:1.5;color:#e3ecff}
.scene .story b{color:var(--gold)}
.flash{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:600px){.flash{grid-template-columns:1fr}}
.fc{position:relative;background:linear-gradient(170deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1.5px solid var(--line);border-radius:18px;padding:14px 10px;text-align:center;color:var(--white);cursor:pointer;min-height:140px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .18s,border-color .2s}
.fc:hover:not(:disabled){transform:translateY(-4px);border-color:var(--cyan)}
.fc:disabled{cursor:default}
.fc .ic{font-size:38px;line-height:1}
.fc .tt{font-family:var(--display);font-weight:700;font-size:13px;line-height:1.3}
.fc .hint{font-size:11px;color:var(--muted)}
.fc.correct{background:linear-gradient(170deg,rgba(46,204,113,.35),rgba(46,204,113,.12));border-color:var(--green)}
.fc.wrong{background:linear-gradient(170deg,rgba(255,59,59,.35),rgba(255,59,59,.1));border-color:var(--red)}
.fc.dim{opacity:.35}
.why{margin-top:14px;padding:12px 14px;border-radius:14px;font-size:14px;line-height:1.5;display:none}
.why.show{display:block}
.why.ok{background:rgba(46,204,113,.14);border:1px solid rgba(46,204,113,.5)}
.why.no{background:rgba(255,59,59,.14);border:1px solid rgba(255,59,59,.5)}

/* Booth 10 */
.hero-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.hero{background:rgba(255,255,255,.06);border:2px solid var(--line);border-radius:16px;padding:12px 6px;color:var(--white);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:96px}
.hero span{font-size:34px;line-height:1}
.hero small{font-size:12px;line-height:1.25;text-align:center}
.hero .hi{position:relative;width:64px;height:64px;display:flex;align-items:center;justify-content:center;font-size:34px;line-height:1}
.hero .hi img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.evlogo{display:block;margin:0 auto 14px;max-width:min(360px,80%);height:auto;background:#fff;border-radius:18px;padding:10px}
.hero.sel{border-color:var(--gold);background:rgba(255,197,61,.15);box-shadow:0 0 18px rgba(255,197,61,.4)}
.field{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:rgba(255,255,255,.07);color:var(--white);font-size:17px;margin-top:6px}
.field:focus{outline:none;border-color:var(--cyan)}
.score-chip{background:linear-gradient(90deg,var(--gold),#ffe08a);color:var(--navy);font-weight:900;font-family:var(--display);padding:2px 10px;border-radius:10px}

/* Overlay */
.overlay{position:fixed;inset:0;background:rgba(3,10,28,.78);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
.overlay.open{display:flex}
.box{background:linear-gradient(180deg,#0e2a5e,#081a3d);border:1px solid var(--line);border-radius:26px;padding:26px 22px;max-width:480px;width:100%;text-align:center;max-height:92vh;overflow:auto}
.box h2{font-size:26px;margin:8px 0}
.box .score{font-family:var(--display);font-weight:900;font-size:40px;background:linear-gradient(90deg,var(--cyan),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;margin:6px 0}
.box p{color:#c8d7f2;line-height:1.5;margin:6px 0 16px}
.rbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:15px;text-align:left}
th,td{padding:10px 8px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
td.rk{font-family:var(--display);font-weight:800;width:52px}
td.sc{font-family:var(--display);font-weight:800;color:var(--gold);text-align:right}
.hic{font-size:22px}
/* Tanda air @OTRchuadsteady (samar, tidak boleh diklik) */
:root{--wm:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='300' height='180'%3E%3Ctext x='30' y='100' transform='rotate(-25 150 90)' font-family='Arial,sans-serif' font-size='16' font-weight='700' fill='%23fff' fill-opacity='0.06'%3E@OTRchuadsteady%3C/text%3E%3C/svg%3E")}
.wm-bg{position:fixed;inset:0;pointer-events:none;z-index:5;background-image:var(--wm);background-repeat:repeat}
.wm-tag{position:fixed;right:8px;bottom:6px;z-index:6;pointer-events:none;font-size:11px;font-weight:600;color:rgba(255,255,255,.35);font-family:var(--body)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wm-bg" aria-hidden="true"></div>

<div class="wrap">

  <!-- ===== LOBI ===== -->
  <section id="lobby">
    <div class="lobbyhead">
      <div>
        <div class="eyebrow">HSAH World Stroke &amp; Diabetic Day 2026</div>
        <h1>Pilih Booth</h1>
        <div class="progress" id="progress"></div>
      </div>
      <button class="btn btn-gold" id="openBoard">🏆 Tangga Pemenang</button>
    </div>
    <div class="grid" id="gridGames" style="margin-top:22px"></div>
    <p class="note">Mainkan 9 booth untuk membuka Booth 10. Markah disimpan pada peranti ini sahaja. Kandungan perlu disemak pakar HSAH sebelum diterbitkan.</p>
  </section>

  <!-- ===== MAIN ===== -->
  <section id="play" hidden>
    <div class="top">
      <button class="back" id="backBtn">← Lobi</button>
      <div class="kick" id="playKick"></div>
    </div>
    <h2 class="ptitle" id="playTitle"></h2>
    <div id="stage"></div>
  </section>
</div>

<!-- Keputusan -->
<div class="overlay" id="result" role="dialog" aria-modal="true">
  <div class="box">
    <div class="kick" id="rKick"></div>
    <h2 id="rTitle"></h2>
    <div class="score" id="rScore"></div>
    <p id="rMsg"></p>
    <div class="rbtns">
      <button class="btn" id="rAgain">Main Semula</button>
      <button class="btn btn-g" id="rBoard" hidden>🏆 Tangga Pemenang</button>
      <button class="btn btn-g" id="rLobby">Lobi</button>
    </div>
  </div>
</div>

<!-- Tangga pemenang -->
<div class="overlay" id="board" role="dialog" aria-modal="true">
  <div class="box">
    <div class="kick">Tangga Pemenang</div>
    <h2>Top 10 Markah</h2>
    <div id="boardList"></div>
    <p class="note" style="margin-top:12px">Rekod disimpan pada peranti ini sahaja.</p>
    <div class="rbtns"><button class="btn btn-g" id="bClose">Tutup</button></div>
  </div>
</div>

<script>
/* =========================================================
   UTILITI & DATA
   ========================================================= */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => a.map(v => [Math.random(), v]).sort((x,y) => x[0]-y[0]).map(x => x[1]);

const HEROES_OLD = [
  { ic:'🦸', n:'Hero Kuat' }, { ic:'🦸‍♀️', n:'Hero Pantas' }, { ic:'👼', n:'Malaikat Penjaga' },
  { ic:'🧑‍⚕️', n:'Hero Kesihatan' }, { ic:'🏃', n:'Pelari Strok' }, { ic:'⭐', n:'Bintang Sihat' }
];
/* 5 ikon superhero Angels. Letak gambar di assets/angels-heroes/1.png hingga 5.png.
   Jika gambar belum ada, emoji akan dipaparkan sebagai ganti. */
const HEROES = [
  { img:'assets/angels-heroes/1.png', ic:'🦸', n:'Hero 1' },
  { img:'assets/angels-heroes/2.png', ic:'🦸‍♀️', n:'Hero 2' },
  { img:'assets/angels-heroes/3.png', ic:'👼', n:'Hero 3' },
  { img:'assets/angels-heroes/4.png', ic:'🧑‍⚕️', n:'Hero 4' },
  { img:'assets/angels-heroes/5.png', ic:'⭐', n:'Hero 5' }
];
const GAME_IDS = ['pt','ot','ph','de','psy','diet','st','hp','ang'];

/* ---------- Sesi peranti & tangga pemenang ---------- */
const SES_KEY = 'hsah-session-2026';
const BOARD_KEY = 'hsah-board-2026';
function getSession(){
  try { const s = JSON.parse(localStorage.getItem(SES_KEY)); return (s && s.scores) ? s : { scores:{} }; }
  catch(e){ return { scores:{} }; }
}
function saveSession(s){ try { localStorage.setItem(SES_KEY, JSON.stringify(s)); } catch(e){} }
function recordScore(id, pts){
  const s = getSession();
  s.scores[id] = Math.max(s.scores[id] || 0, pts);
  saveSession(s);
}
function clearSession(){ try { localStorage.removeItem(SES_KEY); } catch(e){} }
function sessionTotal(s){ return GAME_IDS.reduce((t,id)=> t + (s.scores[id] || 0), 0); }
function playedCount(s){ return GAME_IDS.filter(id => s.scores[id] !== undefined).length; }

function getBoard(){ try { return JSON.parse(localStorage.getItem(BOARD_KEY)) || []; } catch(e){ return []; } }
function addBoard(entry){
  const list = getBoard();
  list.push(entry);
  list.sort((a,b) => b.total - a.total || a.t - b.t);
  try { localStorage.setItem(BOARD_KEY, JSON.stringify(list.slice(0,10))); } catch(e){}
}
function openBoard(){
  const list = getBoard(), medal = i => ['🥇','🥈','🥉'][i] || (i+1);
  $('boardList').innerHTML = list.length ? `
    <table>
      <thead><tr><th>Kedudukan</th><th>Hero</th><th>Nama</th><th style="text-align:right">Markah</th></tr></thead>
      <tbody>${list.map((e,i)=>`<tr>
        <td class="rk">${medal(i)}</td><td class="hic">${esc(e.hero)}</td>
        <td>${esc(e.name)}</td><td class="sc">${e.total}</td></tr>`).join('')}
      </tbody></table>` : '<p>Belum ada rekod. Mainkan 9 booth dan daftar di Booth 10!</p>';
  $('board').classList.add('open');
}

/* =========================================================
   DEFINISI PERMAINAN
   run(stage, end, on) · end({passed, score, scoreText, msg, title, board})
   max = markah maksimum mentah (ditukar kepada 0–100 untuk papan)
   ========================================================= */
const GAMES = {

/* 1 · PT — Jalan Seimbang: 3 tahap, 24 pusingan, zon makin kecil dan makin laju */
pt: { no:1, prof:'Physiotherapy (PT)', title:'Jalan Seimbang', icon:'🦽', color:'blue', max:240,
  desc:'3 tahap · 12 pusingan. Zon hijau makin kecil dan penanda makin laju.',
  run(stage, end, on){
    const TOTAL=12, PER=4, PASS=8, STG=[{w:30,s:1.0},{w:26,s:1.2},{w:22,s:1.4}];
    stage.innerHTML = `
      <div class="hudrow">
        <div class="pill"><b id="p_t">1/3</b>Tahap</div>
        <div class="pill"><b id="p_r">1/24</b>Pusingan</div>
        <div class="pill"><b id="p_s">0</b>Mata</div>
        <div class="pill"><b id="p_c">0</b>Turutan</div>
      </div>
      <div class="arena">
        <div class="prompt">Ketik dalam zon hijau</div>
        <div class="track"><div class="zone" id="p_z"></div><div class="runner" id="p_u"></div></div>
        <button class="big-btn" id="p_b">KETIK</button>
        <div class="feedback" id="p_f"></div>
      </div>`;
    const Z=s=>stage.querySelector(s);
    let round=0, score=0, hits=0, combo=0, locked=false, zc=50, zw=22, speed=1.6, raf=0, t0=performance.now(), done=false;
    const fb=(m,ok)=>{ const f=Z('#p_f'); f.textContent=m; f.className='feedback'+(ok===null?'':ok?' ok':' no'); };
    function newRound(){
      const si=Math.min(Math.floor(round/PER),2), cfg=STG[si], k=round%PER;
      zw=cfg.w; speed=cfg.s+k*0.06; locked=false;
      zc=15+Math.random()*70;
      Z('#p_z').style.left=(zc-zw/2)+'%'; Z('#p_z').style.width=zw+'%';
      Z('#p_t').textContent=`${si+1}/3`;
      Z('#p_r').textContent=`${round+1}/${TOTAL}`;
      fb('',null);
    }
    function frame(now){
      const t=(now-t0)/1000;
      Z('#p_u').style.left=(50+46*Math.sin(t*speed*Math.PI))+'%';
      raf=requestAnimationFrame(frame);
    }
    function tap(){
      if(locked||done) return; locked=true;
      const pos=parseFloat(Z('#p_u').style.left)||50;
      const ok=Math.abs(pos-zc)<=zw/2, u=Z('#p_u');
      if(ok){ hits++; combo++; score+=10+Math.min(combo,5)*2; u.classList.add('hit'); fb('Tepat! Teruskan.',true); }
      else  { combo=0; u.classList.add('miss'); fb('Terlepas zon. Cuba lagi.',false); }
      Z('#p_s').textContent=score; Z('#p_c').textContent=combo;
      setTimeout(()=>u.classList.remove('hit','miss'),350);
      round++;
      setTimeout(()=>{ if(round>=TOTAL) finish(); else newRound(); },800);
    }
    function finish(){
      if(done) return; done=true;
      const passed=hits>=PASS;
      end({ passed, score, max:this.max, scoreText:`${hits} / ${TOTAL} tepat`,
        msg: passed ? 'Anda seimbang melalui 3 tahap! Cop Booth 1 diperoleh.' : `Perlu sekurang-kurangnya ${PASS} ketikan tepat untuk lulus.` });
    }
    Z('#p_b').addEventListener('click', tap);
    newRound(); raf=requestAnimationFrame(frame);
    on(()=>cancelAnimationFrame(raf));
  }
},

/* 2 · OT — Ingat Rutin: 6 tahap, urutan makin panjang */
ot: { no:2, prof:'Occupational Therapy (OT)', title:'Ingat Rutin', icon:'🧩', color:'red', max:700,
  desc:'6 tahap. Urutan rutin harian makin panjang. Anda ada 2 nyawa.',
  run(stage, end, on){
    const T=[ {i:'🛏️',t:'Duduk di birai katil'}, {i:'🧍',t:'Berdiri perlahan'}, {i:'🪥',t:'Gosok gigi'}, {i:'🚿',t:'Mandi dengan kerusi'} ];
    const LEN=[3,4,4,5,5,6], timers=[];
    let lvl=0, lives=2, seq=[], inp=[], showing=false, done=false;
    stage.innerHTML = `
      <div class="hudrow">
        <div class="pill"><b id="o_l">1/6</b>Tahap</div>
        <div class="pill"><b id="o_v">♥♥</b>Nyawa</div>
      </div>
      <div class="arena">
        <div class="prompt" id="o_p">Perhatikan urutan rutin</div>
        <div class="tiles">${T.map((t,k)=>`<button class="tile" data-k="${k}"><span>${t.i}</span><small>${t.t}</small></button>`).join('')}</div>
        <div class="feedback" id="o_f"></div>
      </div>`;
    const Q=s=>stage.querySelector(s), tiles=[...stage.querySelectorAll('.tile')];
    const later=(fn,ms)=>{ timers.push(setTimeout(fn,ms)); };
    on(()=>timers.forEach(clearTimeout));
    const lit=k=>{ tiles[k].classList.add('lit'); later(()=>tiles[k].classList.remove('lit'),420); };
    const speed=()=>Math.max(420, 700-lvl*40);
    function flash(){
      showing=true; inp=[]; Q('#o_p').textContent='Perhatikan urutan rutin';
      seq.forEach((k,n)=>later(()=>lit(k), n*speed()));
      later(()=>{ showing=false; Q('#o_p').textContent='Ulang urutan anda'; }, seq.length*speed()+150);
    }
    function newLevel(){
      seq=[]; for(let n=0;n<LEN[lvl];n++) seq.push(Math.floor(Math.random()*T.length));
      Q('#o_l').innerHTML=`<b>${lvl+1}/${LEN.length}</b>Tahap`; flash();
    }
    function setLives(){ Q('#o_v').textContent='♥'.repeat(Math.max(lives,0))+'♡'.repeat(Math.max(2-lives,0)); }
    function fb(m,ok){ const f=Q('#o_f'); f.textContent=m; f.className='feedback'+(ok===null?'':ok?' ok':' no'); }
    function finish(passed){
      if(done) return; done=true;
      const score = passed ? LEN.length*100 + lives*50 : lvl*100;
      end({ passed, score, max:this.max, scoreText:`${lvl} / ${LEN.length} tahap`,
        msg: passed ? 'Rutin anda kukuh di semua 6 tahap! Cop Booth 2 (OT) diperoleh.' : 'Teruskan latihan. Ingat urutan langkah dengan teliti.' });
    }
    stage.querySelector('.tiles').addEventListener('click', e => {
      const b=e.target.closest('.tile'); if(!b||showing||done) return;
      const k=+b.dataset.k; lit(k); inp.push(k);
      if(seq[inp.length-1]!==k){
        lives--; setLives(); fb('Urutan belum tepat. Ulang semula.',false);
        if(lives<0) return finish(false);
        later(flash,1000);
      } else if(inp.length===seq.length){
        lvl++; fb('Tepat!',true);
        if(lvl>=LEN.length) return finish(true);
        later(newLevel,1000);
      }
    });
    setLives(); newLevel();
  }
},

/* 3 · Pharmacy — Padan Ubat: 3 pusingan memori, 4 → 6 → 8 pasangan */
ph: { no:3, prof:'Pharmacy', title:'Padan Ubat', icon:'💊', color:'cyan', max:100,
  desc:'3 pusingan memori: 4, 6, kemudian 8 pasangan. Kurang langkah, markah lebih tinggi.',
  run(stage, end, on){
    const ALL=[
      {ic:'💊',tt:'Ikut dos doktor'}, {ic:'⏰',tt:'Ambil tepat masa'}, {ic:'🧊',tt:'Simpan sejuk & kering'}, {ic:'🙅',tt:'Jangan kongsi ubat'},
      {ic:'📅',tt:'Ambil ubat setiap hari'}, {ic:'🩹',tt:'Jaga luka dan kaki'}, {ic:'🍬',tt:'Hadkan gula dalam minuman'}, {ic:'🩺',tt:'Ulang pemeriksaan gula darah'}
    ];
    const SIZES=[4,6,8], TOTAL_PAIRS=SIZES.reduce((a,b)=>a+b,0);
    const timers=[]; let r=0, moves=0, matched=0, open=[], lock=false, done=false, cards=[], deck=[], pairs=0;
    on(()=>timers.forEach(clearTimeout));
    function build(){
      pairs=SIZES[r];
      const P=shuffle(ALL).slice(0,pairs);
      deck=shuffle(P.flatMap((p,i)=>[{k:i,type:'ic',v:p.ic},{k:i,type:'tt',v:p.tt}]));
      matched=0; open=[]; lock=false;
      stage.innerHTML = `
        <div class="hudrow">
          <div class="pill"><b>${r+1}/${SIZES.length}</b>Pusingan</div>
          <div class="pill"><b id="m_m">${moves}</b>Langkah</div>
          <div class="pill"><b id="m_p">0/${pairs}</b>Dipadankan</div>
        </div>
        <div class="arena">
          <div class="prompt">Padankan ikon dengan peringatan</div>
          <div class="mem" id="m_g">${deck.map((c,i)=>`
            <button class="mc" data-i="${i}" aria-label="Kad ${i+1}">
              <div class="in"><div class="f">?</div><div class="b ${c.type==='ic'?'ic':''}">${c.type==='ic'?c.v:esc(c.v)}</div></div>
            </button>`).join('')}
          </div>
          <div class="feedback" id="m_f"></div>
        </div>`;
      cards=[...stage.querySelectorAll('.mc')];
    }
    const fb=(m,ok)=>{ const f=stage.querySelector('#m_f'); if(!f) return; f.textContent=m; f.className='feedback'+(ok===null?'':ok?' ok':' no'); };
    stage.addEventListener('click', e=>{
      const el=e.target.closest('.mc'); if(!el||done) return;
      const i=+el.dataset.i;
      if(lock||el.classList.contains('flip')||el.classList.contains('done')) return;
      el.classList.add('flip'); open.push(i);
      if(open.length<2) return;
      lock=true; moves++; stage.querySelector('#m_m').textContent=moves;
      const [ia,ib]=open, a=cards[ia], b=cards[ib];
      if(deck[ia].k===deck[ib].k && deck[ia].type!==deck[ib].type){
        a.classList.add('done'); b.classList.add('done'); matched++;
        stage.querySelector('#m_p').textContent=`${matched}/${pairs}`;
        fb('Padanan betul!',true); open=[]; lock=false;
        if(matched===pairs){
          r++;
          if(r>=SIZES.length) finish();
          else timers.push(setTimeout(build,900));
        }
      } else {
        fb('Belum sepadan. Cuba lagi.',false);
        timers.push(setTimeout(()=>{ a.classList.remove('flip'); b.classList.remove('flip'); open=[]; lock=false; },900));
      }
    });
    function finish(){
      done=true;
      const score=Math.max(20, 100-(moves-TOTAL_PAIRS)*3), passed=moves<=30;
      end({ passed, score, max:this.max, scoreText:`${moves} langkah`,
        msg: passed ? 'Hebat! Anda ingat peringatan ubat di 3 pusingan. Cop Booth 3 diperoleh.' : 'Cuba lagi dengan langkah yang lebih sedikit.' });
    }
    build();
  }
},

/* 4 · DE — Kenali Gula: 20 item, masa makin singkat */
de: { no:4, prof:'Diabetic Educator (DE)', title:'Kenali Gula', icon:'📊', color:'red', max:200,
  desc:'20 item dengan masa makin singkat. Pilih gula rendah atau gula tinggi.',
  run(stage, end, on){
    const POOL=[
      {ic:'🥤',tt:'Teh manis',h:1},{ic:'🍩',tt:'Donat',h:1},{ic:'🍪',tt:'Biskut manis',h:1},{ic:'🍰',tt:'Kek',h:1},
      {ic:'🧃',tt:'Jus kotak bergula',h:1},{ic:'🍬',tt:'Gula-gula',h:1},
      {ic:'💧',tt:'Air kosong',h:0},{ic:'🥗',tt:'Salad',h:0},{ic:'🐟',tt:'Ikan bakar',h:0},{ic:'🥜',tt:'Kacang tanpa gula',h:0},
      {ic:'🥚',tt:'Telur rebus',h:0},{ic:'🥒',tt:'Timun',h:0},{ic:'🥛',tt:'Susu tanpa gula',h:0},{ic:'🍅',tt:'Tomato',h:0}
    ];
    const N=20;
    const items=Array.from({length:N},()=>POOL[Math.floor(Math.random()*POOL.length)]);
    let i=0, correct=0, t=0, lim=5000, tId=0, done=false;
    stage.innerHTML = `
      <div class="hudrow">
        <div class="pill"><b id="d_i">1/${N}</b>Item</div>
        <div class="pill"><b id="d_c">0</b>Betul</div>
      </div>
      <div class="arena">
        <div class="timebar"><div id="d_bar"></div></div>
        <div class="item"><div class="ic" id="d_ic"></div><div class="tt" id="d_tt"></div></div>
        <div class="choice">
          <button class="lo" id="d_lo">Gula Rendah</button>
          <button class="hi" id="d_hi">Gula Tinggi</button>
        </div>
        <div class="feedback" id="d_f"></div>
      </div>`;
    const Z=s=>stage.querySelector(s);
    function show(){
      const it=items[i];
      lim=Math.max(3000, 5000-i*100);
      Z('#d_i').innerHTML=`<b>${i+1}/${N}</b>Item`;
      Z('#d_ic').textContent=it.ic; Z('#d_tt').textContent=it.tt;
      Z('#d_f').textContent=''; Z('#d_f').className='feedback';
      Z('#d_lo').disabled=Z('#d_hi').disabled=false;
      t=lim; Z('#d_bar').style.width='100%';
      clearInterval(tId);
      tId=setInterval(()=>{ t-=100; Z('#d_bar').style.width=(t/lim*100)+'%'; if(t<=0) answer(-1); },100);
    }
    function answer(choice){
      if(done) return; clearInterval(tId);
      const it=items[i], ok=choice===it.h;
      if(ok) correct++;
      Z('#d_c').textContent=correct;
      Z('#d_lo').disabled=Z('#d_hi').disabled=true;
      const f=Z('#d_f'); f.className='feedback '+(ok?'ok':'no');
      f.textContent = ok ? 'Betul!' : (choice===-1 ? 'Masa tamat.' : 'Kurang tepat.') + (it.h ? ' Item ini gula tinggi.' : ' Item ini gula rendah.');
      i++;
      setTimeout(()=>{ if(i>=N) finish(); else show(); },900);
    }
    function finish(){
      if(done) return; done=true; const passed=correct>=16;
      end({ passed, score:correct*10, max:this.max, scoreText:`${correct} / ${N} betul`,
        msg: passed ? 'Anda mengenal pasti pilihan gula dengan baik. Cop Booth 4 diperoleh.' : 'Perlu sekurang-kurangnya 16 jawapan betul. Baca label gula pada makanan.' });
    }
    Z('#d_lo').addEventListener('click',()=>answer(0));
    Z('#d_hi').addEventListener('click',()=>answer(1));
    on(()=>clearInterval(tId));
    show();
  }
},

/* 5 · PSY — Tarik Nafas: 5 kitaran, sasaran 70% */
psy: { no:5, prof:'Psychiatry (PSY)', title:'Tarik Nafas', icon:'🧠', color:'blue', max:100,
  desc:'5 kitaran pernafasan (1 minit). Tekan dan tahan mengikut fasa Tarik, Tahan dan Hembus.',
  run(stage, end, on){
    const CYCLE=12000, CYCLES=5, TOTAL=CYCLE*CYCLES, TICK=100;
    let pressed=false, good=0, samples=0, elapsed=0, done=false, tId=0;
    stage.innerHTML = `
      <div class="breath">
        <div class="phase" id="s_ph">Tekan bulatan untuk mula</div>
        <div class="bcircle" id="s_c">Tekan & tahan</div>
        <div class="meter"><div id="s_m"></div></div>
        <div class="feedback">Tarik nafas (tekan) 4 saat · Tahan 4 saat · Hembus (lepas) 4 saat</div>
      </div>`;
    const Z=s=>stage.querySelector(s), circle=Z('#s_c');
    const setPress=v=>{ pressed=v; circle.classList.toggle('on',v); };
    const phaseOf=ms=>{ const p=ms%CYCLE; return p<4000?'tarik':p<8000?'tahan':'hembus'; };
    const release=()=>setPress(false);
    window.addEventListener('pointerup',release); window.addEventListener('pointercancel',release);
    on(()=>{ clearInterval(tId); window.removeEventListener('pointerup',release); window.removeEventListener('pointercancel',release); });
    circle.addEventListener('pointerdown',e=>{ e.preventDefault(); if(done) return; if(!tId) started(); setPress(true); });
    function started(){
      tId=setInterval(()=>{
        elapsed+=TICK;
        const ph=phaseOf(elapsed), expected=ph!=='hembus';
        samples++; if(pressed===expected) good++;
        const labels={tarik:'Tarik nafas · tekan & tahan',tahan:'Tahan · kekal menekan',hembus:'Hembus · lepaskan'};
        const kitaran=Math.min(CYCLES, Math.floor(elapsed/CYCLE)+1);
        Z('#s_ph').textContent=`Kitaran ${kitaran}/${CYCLES} · ${labels[ph]}`;
        Z('#s_m').style.width=(elapsed/TOTAL*100)+'%';
        if(elapsed>=TOTAL){ clearInterval(tId); finish(); }
      },TICK);
    }
    function finish(){
      if(done) return; done=true;
      const pct=Math.round(good/Math.max(samples,1)*100), passed=pct>=70;
      end({ passed, score:pct, max:this.max, scoreText:`${pct}% irama tepat`,
        msg: passed ? 'Pernafasan anda terkawal dengan baik sepanjang 5 kitaran. Cop Booth 5 (PSY) diperoleh.' : 'Cuba ikut fasa dengan lebih tenang. Sasaran 70% atau lebih.' });
    }
  }
},

/* 6 · Dietitian — Pinggan Sihat: 2 pinggan, 4 dan 6 slot */
diet: { no:6, prof:'Dietitian', title:'Pinggan Sihat', icon:'🍎', color:'cyan', max:100,
  desc:'2 pinggan: sarapan (4 makanan) dan makan malam (6 makanan). Seimbangkan kumpulan makanan.',
  run(stage, end, on){
    const POOL=[
      {ic:'🥦',g:'A',tt:'Brokoli'},{ic:'🥕',g:'A',tt:'Lobak'},{ic:'🍎',g:'A',tt:'Epal'},{ic:'🍉',g:'A',tt:'Tembikai'},{ic:'🥬',g:'A',tt:'Sawi'},
      {ic:'🍚',g:'B',tt:'Nasi perang'},{ic:'🍠',g:'B',tt:'Ubi keledek'},{ic:'🥖',g:'B',tt:'Roti gandum'},
      {ic:'🐟',g:'C',tt:'Ikan'},{ic:'🥚',g:'C',tt:'Telur'},{ic:'🍗',g:'C',tt:'Ayam tanpa kulit'},
      {ic:'🍟',g:'X',tt:'Kentang goreng'},{ic:'🥤',g:'X',tt:'Minuman manis'}
    ];
    const ROUNDS=[
      {name:'Sarapan', slots:4, t:{A:2,B:1,C:1}},
      {name:'Makan Malam', slots:6, t:{A:3,B:2,C:1}}
    ];
    let r=0, plate=[], done=false, scores=[];
    const Z=s=>stage.querySelector(s);
    function renderRound(){
      const R=ROUNDS[r]; plate=[];
      stage.innerHTML = `
        <div class="hudrow">
          <div class="pill"><b>${r+1}/${ROUNDS.length}</b>Pinggan</div>
          <div class="pill"><b>${R.name}</b>${R.slots} makanan</div>
        </div>
        <div class="guide">
          <div><b>Separuh</b>Sayur &amp; buah</div><div><b>¼</b>Karbohidrat</div><div><b>¼</b>Protein</div><div><b>Elak</b>Goreng &amp; manis</div>
        </div>
        <div class="arena">
          <div class="plate" id="pl" style="grid-template-columns:repeat(${R.slots>4?3:2},1fr);grid-template-rows:repeat(${R.slots>4?2:2},1fr)"></div>
          <div class="pool">${POOL.map((p,i)=>`<button data-i="${i}"><span>${p.ic}</span><small>${p.tt}</small></button>`).join('')}</div>
          <button class="big-btn" id="pl_go" disabled>Hantar Pinggan</button>
          <div class="feedback" id="pl_f">Ketik makanan untuk letak di pinggan. Ketik semula di pinggan untuk buang.</div>
        </div>`;
      stage.querySelectorAll('.pool button').forEach(b=>b.addEventListener('click',()=>{
        const i=+b.dataset.i; if(done||plate.includes(i)||plate.length>=R.slots) return;
        plate.push(i); refresh();
      }));
      Z('#pl_go').addEventListener('click',submit);
      renderPlate();
    }
    function renderPlate(){
      const R=ROUNDS[r];
      Z('#pl').innerHTML = Array.from({length:R.slots},(_,k)=>{
        const p=POOL[plate[k]];
        return `<div class="slot ${p?'full':''}" data-s="${k}">${p?p.ic:'+'}</div>`;
      }).join('');
      Z('#pl').querySelectorAll('.slot').forEach(s=>s.addEventListener('click',()=>{
        const k=+s.dataset.s; if(plate[k]!==undefined){ plate.splice(k,1); refresh(); }
      }));
      Z('#pl_go').disabled = plate.length!==R.slots;
    }
    function refresh(){
      stage.querySelectorAll('.pool button').forEach(b=>b.classList.toggle('used', plate.includes(+b.dataset.i)));
      renderPlate();
    }
    function submit(){
      const R=ROUNDS[r]; if(plate.length!==R.slots||done) return;
      const items=plate.map(i=>POOL[i]);
      const cnt=g=>items.filter(x=>x.g===g).length;
      const x=cnt('X');
      const dev=Math.abs(cnt('A')-R.t.A)+Math.abs(cnt('B')-R.t.B)+Math.abs(cnt('C')-R.t.C);
      const sc=Math.max(0, 100-15*dev-30*x);
      scores.push(sc);
      Z('#pl_f').className='feedback '+(sc>=80?'ok':'no');
      Z('#pl_f').textContent = sc>=80 ? `Pinggan ${R.name} seimbang! (${sc} markah)` : `Belum seimbang (${sc} markah). Semak kumpulan makanan.`;
      Z('#pl_go').disabled=true;
      setTimeout(()=>{ r++; if(r>=ROUNDS.length) finish(); else renderRound(); },1600);
    }
    function finish(){
      if(done) return; done=true;
      const avg=Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
      const passed=avg>=80;
      end({ passed, score:avg, max:this.max, scoreText:`${avg} / 100 markah purata`,
        msg: passed ? 'Pinggan sarapan dan makan malam yang seimbang! Cop Booth 6 (Dietitian) diperoleh.' : 'Ingat: separuh pinggan sayur dan buah, satu karbohidrat, satu protein, elak goreng dan manis.' });
    }
    renderRound();
  }
},

/* 7 · Speech Therapy — Sebut Pantas: 10 frasa dengan mikrofon */
st: { no:7, prof:'Speech Therapy (ST) · Hospital Pantai', title:'Sebut Pantas', icon:'💬', color:'red', max:200,
  desc:'10 frasa latihan pertuturan dengan suara anda. 2 percubaan setiap frasa.',
  run(stage, end, on){
    const PH=[
      {t:'Saya sihat dan kuat', tip:'Sebut perlahan dan jelas.'},
      {t:'Muka, lengan, cakap, masa', tip:'Ini singkatan FAST untuk strok.'},
      {t:'Hubungi sembilan sembilan sembilan', tip:'Nombor kecemasan di Malaysia.'},
      {t:'Tarik nafas dan hembus perlahan', tip:'Ambil nafas dahulu, kemudian sebut.'},
      {t:'Ambil ubat ikut arahan doktor', tip:'Sebut setiap perkataan dengan tenang.'},
      {t:'Strok perlu dirawat dengan segera', tip:'Ingat, masa adalah segalanya.'},
      {t:'Saya minum air secukupnya setiap hari', tip:'Sebut dengan irama yang tenang.'},
      {t:'Periksa kaki saya setiap hari', tip:'Pemeriksaan kaki penting untuk pesakit diabetes.'},
      {t:'Pinggan sihat ada sayur dan buah', tip:'Sebut setiap bahagian dengan jelas.'},
      {t:'Gula darah saya perlu dipantau', tip:'Frasa terakhir, teruskan dengan yakin.'}
    ];
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const NUM = {kosong:'0',satu:'1',dua:'2',tiga:'3',empat:'4',lima:'5',enam:'6',tujuh:'7',lapan:'8',sembilan:'9'};
    const norm = s => String(s).toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(Boolean).map(w => NUM[w] ?? w);
    const ratio = (target, said) => { const t=norm(target), s=new Set(norm(said)); return t.filter(w=>s.has(w)).length / t.length; };
    const timers=[]; let idx=0, score=0, attempt=0, busy=false, done=false, rec=null, got=false;
    const Z=s=>stage.querySelector(s);
    on(()=>{ timers.forEach(clearTimeout); try { rec && rec.abort(); } catch(e){} });

    stage.innerHTML = `
      <div class="hudrow">
        <div class="pill"><b id="s_n">1/${PH.length}</b>Frasa</div>
        <div class="pill"><b id="s_s">0</b>Mata</div>
        <div class="pill"><b id="s_a">1/2</b>Cubaan</div>
      </div>
      <div class="arena">
        <div class="kick" style="text-align:center">Sebut frasa ini dengan kuat</div>
        <div class="prompt" id="s_t"></div>
        <p class="tip" id="s_tip"></p>
        <button class="big-btn" id="s_mic">🎤 Tekan & Sebut</button>
        <div class="status" id="s_st"></div>
        <div class="heard" id="s_h"></div>
        <div class="feedback" id="s_f"></div>
        <button class="btn ghost" id="s_man" hidden>Saya sudah sebut (penilaian kendiri)</button>
        <p class="mic-note">Pengecaman suara memerlukan kebenaran mikrofon dan sambungan internet. Jika tidak disokong, gunakan penilaian kendiri.</p>
      </div>`;

    const fb=(m,ok)=>{ const f=Z('#s_f'); f.textContent=m; f.className='feedback'+(ok===null?'':ok?' ok':' no'); };
    const setBusy=b=>{ busy=b; Z('#s_mic').disabled=b||!SR; Z('#s_mic').classList.toggle('mic-on',b); };

    function showPhrase(){
      const p=PH[idx]; attempt=0; busy=false;
      Z('#s_n').innerHTML=`<b>${idx+1}/${PH.length}</b>Frasa`;
      Z('#s_a').innerHTML='<b>1/2</b>Cubaan';
      Z('#s_t').textContent='“'+p.t+'”';
      Z('#s_tip').textContent=p.tip;
      Z('#s_h').textContent=''; fb('',null);
      Z('#s_st').textContent = SR ? 'Tekan butang, kemudian sebut frasa.' : 'Pengecaman suara tidak disokong. Gunakan penilaian kendiri.';
      Z('#s_mic').disabled = !SR;
      Z('#s_man').hidden = SR ? true : false;
    }
    function award(pts,msg){
      if(done) return;
      score+=pts; Z('#s_s').textContent=score;
      fb(msg+(pts?` (+${pts})`:''), pts>0);
      idx++; setBusy(true);
      if(idx>=PH.length){ finish(); return; }
      timers.push(setTimeout(showPhrase,1400));
    }
    function resolve(r){
      const pts = r>=0.99 ? 20 : r>=0.7 ? 14 : 0;
      if(pts>0 || attempt>=1){ award(pts, pts>0 ? 'Sebutan jelas!' : 'Belum tepat.'); }
      else {
        attempt=1; Z('#s_a').innerHTML='<b>2/2</b>Cubaan';
        fb('Hampir! Cuba sekali lagi, sebut perlahan-lahan.',false);
        setBusy(false); Z('#s_st').textContent='Tekan butang untuk cubaan kedua.';
      }
    }
    function listen(){
      if(!SR || busy || done) return;
      got=false;
      try {
        rec=new SR();
        rec.lang='ms-MY'; rec.interimResults=false; rec.maxAlternatives=3;
        rec.onresult=e=>{
          got=true;
          const alts=[...e.results[0]].map(a=>a.transcript);
          const best=Math.max(...alts.map(a=>ratio(PH[idx].t,a)));
          Z('#s_h').textContent='Anda sebut: '+alts[0];
          setBusy(false); resolve(best);
        };
        rec.onerror=()=>{ setBusy(false); Z('#s_st').textContent='Mikrofon tidak dapat digunakan. Gunakan penilaian kendiri.'; Z('#s_man').hidden=false; };
        rec.onend=()=>{ if(!got && !done){ setBusy(false); Z('#s_st').textContent='Tiada suara dikesan. Tekan butang dan cuba lagi.'; } };
        setBusy(true); Z('#s_st').textContent='Sedang mendengar… sebut sekarang.';
        rec.start();
      } catch(err){
        setBusy(false); Z('#s_st').textContent='Mikrofon tidak tersedia. Gunakan penilaian kendiri.'; Z('#s_man').hidden=false;
      }
    }
    Z('#s_mic').addEventListener('click', listen);
    Z('#s_man').addEventListener('click', ()=>{ if(!busy && !done) award(12,'Dicatat melalui penilaian kendiri.'); });
    function finish(){
      if(done) return; done=true;
      const passed=score>=120;
      end({ passed, score, max:this.max, scoreText:`${score} / 200 markah`,
        msg: passed ? 'Pertuturan jelas merentas 10 frasa! Cop Booth 7 diperoleh.' : 'Teruskan latihan. Sebut perlahan-lahan dan jelas.' });
    }
    showPhrase();
  }
},

        st++;
        if(st>=STAGES.length) return timers.push(setTimeout(()=>finish(true),1800));

        btn.classList.remove('dim'); btn.classList.add('wrong'); lives--; lv();

        st++;
        if(st>=STAGES.length) return timers.push(setTimeout(()=>finish(false),2600));
        timers.push(setTimeout(render,2800));
      }
    }
    function finish(passed){
      if(done) return; done=true; clearInterval(tId);
      const solved=Math.min(st,STAGES.length);
      const score=solved*100+lives*40;
      end({ passed, score, max:this.max, scoreText:`${solved} / ${STAGES.length} situasi`,

    }
    tId=setInterval(()=>{ left--; Z('#h_t').textContent=left; Z('#h_b').style.width=(left/LIMIT*100)+'%'; if(left<=0) finish(false); },1000);
    on(()=>clearInterval(tId));
    lv(); render();
  }
},

              <span>${GAMES[id].icon} ${GAMES[id].title}</span>
              <b>${ses.scores[id]!==undefined ? ses.scores[id]+' markah' : 'Belum'}</b>
            </div>`).join('')}
          </div>
        </div>`;
      return;
    }
    const total=sessionTotal(ses);
    let name='', hero=null;
    stage.innerHTML = `
      <div class="arena">
        <div class="lbl">Jumlah markah anda: <span class="score-chip">${total}</span></div>
        <div class="list">${GAME_IDS.map(id=>`
          <div class="row got"><span>${GAMES[id].icon} ${GAMES[id].title}</span><b>${ses.scores[id]} markah</b></div>`).join('')}
        </div>
        <div class="lbl2">Nama anda (maks 14 huruf)</div>
        <input class="field" id="q_n" maxlength="14" placeholder="Taip nama" autocomplete="off">
        <div class="lbl2">Pilih ikon hero</div>
        <div class="hero-grid">${HEROES.map((h,k)=>`<button class="hero" data-k="${k}"><span class="hi"><img src="${h.img}" alt="" onerror="this.remove()">${h.ic}</span><small>${h.n}</small></button>`).join('')}</div>
        <button class="big-btn" id="q_go" disabled>Daftar &amp; Masuk Tangga</button>
      </div>`;
    const Z=s=>stage.querySelector(s);
    const check=()=>{ name=Z('#q_n').value.replace(/[<>]/g,'').trim().slice(0,14); Z('#q_go').disabled=!(name.length>0 && hero!==null); };
    Z('#q_n').addEventListener('input',check);
    stage.querySelectorAll('.hero').forEach(b=>b.addEventListener('click',()=>{
      hero=+b.dataset.k;
      stage.querySelectorAll('.hero').forEach(x=>x.classList.toggle('sel',x===b));
      check();
    }));
    Z('#q_go').addEventListener('click',()=>{
      if(!name || hero===null) return;
      addBoard({ id:Date.now(), name, hero:HEROES[hero].ic, total, t:Date.now() });
      clearSession();
      end({ passed:true, title:'Markah Disimpan', scoreText:`${total} markah`,
        msg:`Terima kasih, ${name}! Markah anda telah masuk tangga pemenang.`, board:true });
    });
  }
}
};

/* =========================================================
   ENJIN: lobi, pelancaran, keputusan
   ========================================================= */
let active=null, lastId=null;

function renderProgress(){
  const ses=getSession(), n=playedCount(ses);
  $('progress').textContent = `Booth dimainkan: ${n}/9 · Jumlah markah: ${sessionTotal(ses)}`;
}
function showScreen(s){
  $('lobby').hidden = s!=='lobby'; $('play').hidden = s!=='play';
  if(s==='lobby') renderProgress();
  window.scrollTo({top:0});
}
function stopActive(){
  if(!active) return;
  const cl=active.cleanup.slice(); active.ended=true; active=null;
  cl.forEach(f=>{ try{ f(); }catch(e){} });
}
function closeOverlay(id){ $(id).classList.remove('open'); }
function openResult(res, g){
  $('rKick').textContent = g.title;
  $('rTitle').textContent = res.title || (res.passed ? 'Lulus!' : 'Belum lulus');
  $('rScore').textContent = res.scoreText || (res.score + ' mata');
  $('rMsg').textContent = res.msg || '';
  $('rBoard').hidden = !res.board;
  $('result').classList.add('open');
}
function launch(id){
  stopActive(); closeOverlay('result');
  lastId=id;
  const g=GAMES[id];
  showScreen('play');
  $('playKick').textContent = `Booth ${g.no} · ${g.prof}`;
  $('playTitle').textContent = g.title;
  const stage=$('stage'); stage.innerHTML='';
  const ctx={ cleanup:[], ended:false }; active=ctx;
  const on = f => ctx.cleanup.push(f);
  const end = res => {
    if(ctx.ended) return; ctx.ended=true;
    const cl=ctx.cleanup.slice(); ctx.cleanup=[];
    cl.forEach(f=>{ try{ f(); }catch(e){} });
    if(active===ctx) active=null;
    if(id!=='q10' && res.score!=null && g.max){
      const pts=Math.round(Math.min(100, Math.max(0, res.score/g.max*100)));
      recordScore(id, pts);
      res = { ...res, scoreText: `${res.scoreText} · ${pts} markah` };
    }
    window.__onResult && window.__onResult(id, !!res.passed, res.score||0);
    openResult(res, g);
  };
  g.run.call(g, stage, end, on);
}
function goLobby(){ stopActive(); closeOverlay('result'); showScreen('lobby'); }

/* Lobi */
$('gridGames').innerHTML = Object.entries(GAMES).map(([id,g]) => `
  <button class="gc ${g.color}" data-id="${id}">
    <div class="no">BOOTH ${g.no}</div>
    <div class="gi">${g.icon}</div>
    <h3>${g.title}</h3>
    <p>${g.prof}</p>
    <p>${g.desc}</p>
    <span class="go">Main →</span>
  </button>`).join('');
$('gridGames').querySelectorAll('.gc').forEach(b=>b.addEventListener('click',()=>launch(b.dataset.id)));

$('backBtn').addEventListener('click', goLobby);
$('rAgain').addEventListener('click', ()=>{ closeOverlay('result'); launch(lastId); });
$('rLobby').addEventListener('click', goLobby);
$('rBoard').addEventListener('click', openBoard);
$('openBoard').addEventListener('click', openBoard);
$('bClose').addEventListener('click', ()=>closeOverlay('board'));
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeOverlay('board'); });

renderProgress();
window.__onResult = window.__onResult || ((id,passed,score)=>{ console.log('Keputusan', id, passed, score); });
</script>
